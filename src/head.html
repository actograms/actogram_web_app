<!--
  ==========================================================================
  Actogram web app
  Copyright (c) 2026 The Actogram Web Application Development Team.
  Released under the MIT License (see LICENSE).
  ==========================================================================

  WHAT THIS FILE IS
    A single, self-contained web page that plots and analyses rodent
    locomotor activity rhythms and lighting records stored in the
    text-based .AWD data files. It needs no server and no
    installation: open it in a browser. Data files are read locally with
    the File API and are never uploaded.

  HOW THE FILE IS ORGANISED (generated by build.sh from src/)
    1. <head>
       - <title> and the web-font links (Google Fonts; the page falls back
         to system fonts when offline).
       - One <style> block (src/head.html): design tokens (colours and
         fonts as CSS custom properties) for the light and dark themes,
         then the layout and component styles.
    2. <body> markup (src/body.html)
       - Page header.
       - Left "control rail": recordings, actogram display, lighting,
         analysis range, onset detection and regression fits.
       - Main column: summary strip, actogram canvas with its legend and
         zoom bar, and the analysis tabs.
       - Footer and a toast element for short status messages.
       Most content (file list, schedule editor, tab contents, tables) is
       generated by JavaScript into the empty containers marked below.
    3. Three <script> blocks, in this order:
       - src/gen.js  -> window.DemoAWD : seeded simulator that writes the
                        demo recordings in AWD format (synthetic data only).
       - src/core.js -> window.Acto    : pure functions with no DOM access
                        (parsing, binning, lighting detection,
                        periodograms, onset detection, statistics).
       - src/app.js  : user interface. Holds the application state, draws
                        the actogram and charts on <canvas>, renders the
                        tabs, and wires every control to its handler.

  DATA FLOW
    file text -> Acto.parseAWD() -> record (counts, light, header)
              -> Acto.binRecord() -> bins (activity, mean light)
              -> lighting states (recorded light or user schedule)
              -> onset detection -> regression fits -> phase (ZT / CT)
              -> drawing (actogram canvas) and analysis tabs.

  CONVENTIONS
    - Times inside the app are "absolute minutes" counted from 00:00 of
      the first calendar day of the recording (no time-zone or
      daylight-saving correction).
    - Element ids used by the scripts are listed next to each control in
      the markup comments; change both together.
    - Colours are never written as literals in components: every colour
      comes from a token below so that both themes stay consistent.
  ==========================================================================
-->
<title>Actogram web app</title>
<!-- Web fonts: Archivo (headings), Public Sans (body text), IBM Plex Mono
     (numbers and data). All three are under the SIL Open Font License 1.1.
     preconnect speeds up the first font request. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;600&display=swap">
<style>
/* ==========================================================================
   STYLES
   Layout concept: an instrument-style layout. A control rail on the
   left, the actogram as the main specimen, analysis tabs below it. On
   screens narrower than 900 px everything stacks in one column with the
   actogram first.
   ========================================================================== */

/* --------------------------------------------------------------------------
   1. Design tokens (light theme = default values)
   The canvas drawing code in app.js reads several of these tokens with
   getComputedStyle(), so the actogram and charts follow the theme too.
   -------------------------------------------------------------------------- */
:root {
  /* Surfaces and text */
  --bg: #f4f5f8;          /* page background */
  --panel: #ffffff;       /* cards / boxes and the plot background */
  --panel-2: #eef0f5;     /* inputs, stat tiles, hover states */
  --ink: #141821;         /* primary text */
  --muted: #586074;       /* secondary text, axis labels */
  --line: #dadee7;        /* borders, grid lines, row baselines */
  --accent: #3446c9;      /* interactive accent: active buttons, analysis-range bracket */
  --accent-ink: #ffffff;  /* text on the accent colour */

  /* Actogram */
  --light-phase: #f7e7a6; /* shading for light (lights on) */
  --dark-phase: #d3d8e3;  /* shading for dark (lights off) */
  --nodata: #f0e3e3;      /* shading for missing activity data */
  --ld-light: #f0b429;    /* heat maps: light-phase bar at the top of each row */
  --ld-dark: #39404f;     /* heat maps: dark-phase bar at the top of each row */
  --total-bar: #3e87b8;   /* right panel: per-row total activity (steel blue) */
  --bar: #141821;         /* activity bars / heat-map colour */
  --onset: #d9481f;       /* legacy onset colour (kept for exports and older code paths) */
  --offset: #1baf7a;      /* activity offset markers */
  --fit: #2a78d6;         /* legacy single-fit colour */

  /* Regression fits: fixed categorical order, fit 1 = --fit1, etc.
     Onsets that belong to no fit are drawn with --unused. */
  --fit1: #2a78d6; --fit2: #eb6834; --fit3: #1baf7a; --fit4: #6250d6; --fit5: #e87ba4; --fit6: #008300; --unused: #9aa1af;

  --warn: #9a5b00;        /* warnings and the "simulated demo" chip */

  /* Typography */
  --font-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Public Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --radius: 6px;
}

/* Dark theme, part 1: follows the operating-system setting unless the
   page has been explicitly set to light with data-theme="light". */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1117; --panel: #161a22; --panel-2: #1d222c; --ink: #e8ebf1; --muted: #9ba3b4;
    --line: #2a303c; --accent: #8a97ff; --accent-ink: #0e1117; --light-phase: #4b4220;
    --dark-phase: #232835; --ld-light: #e8b730; --ld-dark: #5b6378; --total-bar: #5aa2d0; --nodata: #3a2626; --bar: #e8ebf1; --onset: #ff7a52; --offset: #2fc48e;
    --fit: #5aa0ee; --fit1: #3987e5; --fit2: #d95926; --fit3: #199e70; --fit4: #9085e9; --fit5: #d55181; --fit6: #2f9e2f; --unused: #6b7383; --warn: #e3a648; color-scheme: dark;
  }
}
/* Dark theme, part 2: an explicit data-theme="dark" on <html> wins over
   the operating-system setting. Same values as above. */
:root[data-theme="dark"] {
  --bg: #0e1117; --panel: #161a22; --panel-2: #1d222c; --ink: #e8ebf1; --muted: #9ba3b4;
  --line: #2a303c; --accent: #8a97ff; --accent-ink: #0e1117; --light-phase: #4b4220;
  --dark-phase: #232835; --ld-light: #e8b730; --ld-dark: #5b6378; --total-bar: #5aa2d0; --nodata: #3a2626; --bar: #e8ebf1; --onset: #ff7a52; --offset: #2fc48e;
  --fit: #5aa0ee; --fit1: #3987e5; --fit2: #d95926; --fit3: #199e70; --fit4: #9085e9; --fit5: #d55181; --fit6: #2f9e2f; --unused: #6b7383; --warn: #e3a648; color-scheme: dark;
}

/* --------------------------------------------------------------------------
   2. Base elements and page frame
   -------------------------------------------------------------------------- */
* { box-sizing: border-box; }
/* The scripts show and hide elements with the hidden attribute; make sure
   no component rule (e.g. display:flex) can override it. */
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.45; }
/* Outer wrapper: side gutters respect phone safe areas (notches). */
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 40px; max-width: 1600px; margin: 0 auto; }
header.top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; padding-bottom: 14px; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
header.top h1 { font-family: var(--font-display); font-weight: 700; font-size: 1.45rem; letter-spacing: -0.01em; margin: 0; }
header.top p { margin: 0; color: var(--muted); font-size: 0.86rem; max-width: 70ch; }

/* Two-column layout: fixed-width control rail + flexible main column.
   minmax(0, 1fr) lets wide content (tables, canvas) shrink instead of
   pushing the page wider than the screen. */
.layout { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 900px) { .layout { grid-template-columns: minmax(0, 1fr); } .layout > main { order: -1; } }
aside.rail { display: flex; flex-direction: column; gap: 12px; }

/* --------------------------------------------------------------------------
   3. Boxes, form fields and buttons
   -------------------------------------------------------------------------- */
/* A .box is one panel (a section of the control rail or of the main column). */
.box { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; min-width: 0; }
.box h2 { font-family: var(--font-display); font-size: 0.74rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 10px; }
/* .field: two-column grid of label / control pairs; .full spans both columns. */
.field { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; align-items: center; }
.field label { font-size: 0.83rem; color: var(--muted); }
.field .full { grid-column: 1 / -1; }
input[type="number"], input[type="text"], input[type="time"], select {
  width: 100%; min-width: 0; font: inherit; font-size: 0.85rem; color: var(--ink); background: var(--panel-2);
  border: 1px solid var(--line); border-radius: 4px; padding: 4px 6px; font-variant-numeric: tabular-nums;
}
input[type="range"] { width: 100%; accent-color: var(--accent); }
input[type="checkbox"] { accent-color: var(--accent); }
.check { display: flex; align-items: center; gap: 6px; font-size: 0.83rem; color: var(--ink); }
button, .btn {
  font: inherit; font-size: 0.82rem; font-weight: 500; color: var(--ink); background: var(--panel-2); border: 1px solid var(--line);
  border-radius: 4px; padding: 5px 10px; cursor: pointer; line-height: 1.2;
}
button:hover, .btn:hover { border-color: var(--accent); }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
/* .on = toggled / pressed state (e.g. "Editing onsets", the active mouse tool). */
button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button:disabled { opacity: 0.45; cursor: default; }
button:disabled:hover { border-color: var(--line); }
/* Visible keyboard focus for every interactive element. */
button:focus-visible, input:focus-visible, select:focus-visible, .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

/* --------------------------------------------------------------------------
   4. Recordings panel (drop zone and loaded-file list)
   -------------------------------------------------------------------------- */
.drop { border: 1.5px dashed var(--line); border-radius: var(--radius); padding: 12px; text-align: center; color: var(--muted); font-size: 0.83rem; cursor: pointer; }
.drop.hot { border-color: var(--accent); color: var(--ink); }       /* while a file is dragged over the page */
.files { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }
.file { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 6px; padding: 5px 8px; border-radius: 4px; border: 1px solid transparent; cursor: pointer; font-size: 0.83rem; }
.file:hover { background: var(--panel-2); }
.file.sel { border-color: var(--accent); background: var(--panel-2); }  /* the recording currently shown */
.file .nm { font-family: var(--font-mono); font-size: 0.78rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file .x { border: none; background: none; padding: 0 4px; color: var(--muted); }  /* remove-file button */
.tag { font-family: var(--font-mono); font-size: 0.7rem; color: var(--muted); }    /* small secondary labels */
.demo-note { font-size: 0.75rem; color: var(--muted); margin: 6px 0 0; }

/* --------------------------------------------------------------------------
   5. Main column: summary strip, legend and toolbar
   -------------------------------------------------------------------------- */
main { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.summary { display: flex; flex-wrap: wrap; gap: 6px 22px; align-items: baseline; }
.summary .k { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); display: block; }
.summary .v { font-family: var(--font-mono); font-size: 0.88rem; }
.summary .title { font-family: var(--font-display); font-weight: 600; font-size: 1.1rem; }
.chip { display: inline-block; font-family: var(--font-mono); font-size: 0.72rem; padding: 1px 7px; border-radius: 10px; border: 1px solid var(--line); color: var(--muted); }
.chip.synth { border-color: var(--warn); color: var(--warn); }  /* marks simulated demo data */
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 0.77rem; color: var(--muted); align-items: center; }
/* Colour-scale bar shown in the legend when a heat map is selected. */
.cbar { display: inline-flex; align-items: center; gap: 6px; }
.cbar-ramp { display: inline-block; width: 120px; height: 10px; border-radius: 2px; border: 1px solid var(--line); }
.sw { display: inline-block; width: 12px; height: 12px; border-radius: 2px; vertical-align: -2px; margin-right: 4px; border: 1px solid var(--line); }  /* colour swatch */

/* --------------------------------------------------------------------------
   6. Actogram canvas, zoom bar and overlays
   -------------------------------------------------------------------------- */
/* The wrapper is the positioning context for the tooltip and the
   zoom/selection rectangle, which are HTML elements laid over the canvas. */
.canvas-wrap { position: relative; overflow-x: auto; }
canvas { display: block; }
/* touch-action: let vertical page scrolling work on touch screens while
   horizontal drags reach the canvas (used for panning when zoomed). */
#acto { touch-action: pan-y; }

/* View/tool bar above the actogram (always shown). Three rows of controls
   (.zrow): mouse tools, view (zoom and move), regression fits; .zh is the help line. */
.zoombar { display: flex; flex-direction: column; align-items: stretch; gap: 6px; padding: 6px 8px; margin-bottom: 8px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px; }
.zoombar .zrow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; }
.zoombar .seg button { min-width: 0; padding: 3px 9px; }          /* segmented tool buttons */
.zoombar .zl { min-width: 44px; font-family: var(--font-display); font-size: 0.72rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.zoombar .zg { display: inline-flex; align-items: center; gap: 4px; }   /* a labelled group of buttons */
.zoombar .zg button { min-width: 28px; padding: 3px 6px; background: var(--panel); }
.zoombar .zg button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.zoombar .zv { font-family: var(--font-mono); font-size: 0.8rem; min-width: 34px; text-align: center; font-variant-numeric: tabular-nums; }  /* zoom factor readout */
.zoombar .zh { font-size: 0.74rem; }

/* Regression-fit chips in the bar: click = make active; the active fit is outlined. */
.fitchips { display: inline-flex; flex-wrap: wrap; gap: 4px; }
.fitchip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 4px 2px 8px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); font-size: 0.78rem; cursor: pointer; }
.fitchip:hover { border-color: var(--accent); }
.fitchip.sel { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.fitchip .sw { margin: 0; }
.fitchip .x { border: none; background: none; padding: 0 4px; color: var(--muted); min-width: 0; }
/* Rubber-band rectangle drawn while dragging on the actogram.
   Solid accent = zoom box; dashed --fit2 = onset selection for a fit.
   The tinted fill comes from ::before so the border keeps full opacity. */
.zoomsel { position: absolute; pointer-events: none; border: 1.5px solid var(--accent); border-radius: 2px; z-index: 4; }
.zoomsel::before { content: ""; position: absolute; inset: 0; background: var(--accent); opacity: 0.12; }
/* Analysis-range band shown while dragging over rows (row selection). */
.zoomsel.range { border-color: var(--accent); border-width: 2px 0; border-radius: 0; }
.zoomsel.select { border-style: dashed; border-color: var(--fit2); }
.zoomsel.select::before { background: var(--fit2); }

/* Hover tooltip used by the actogram and every chart. */
.tip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 5px 8px; font-family: var(--font-mono); font-size: 0.74rem; white-space: nowrap; box-shadow: 0 2px 8px rgba(0,0,0,0.12); z-index: 5; }

/* --------------------------------------------------------------------------
   7. Analysis tabs, stat tiles and tables
   -------------------------------------------------------------------------- */
.tabs { display: flex; flex-wrap: wrap; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 12px; }
.tab { background: none; border: none; border-bottom: 2px solid transparent; border-radius: 0; padding: 7px 10px; color: var(--muted); font-weight: 500; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
/* Stat tiles: key (.k), value (.v) and sub-line (.s). Columns adapt to width. */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin-bottom: 12px; }
.stat { background: var(--panel-2); border-radius: 4px; padding: 8px 10px; }
.stat .k { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); }
.stat .v { font-family: var(--font-mono); font-size: 1.05rem; font-variant-numeric: tabular-nums; }
.stat .s { font-size: 0.74rem; color: var(--muted); }
/* Tables scroll inside their own container (both directions) so the page
   itself never scrolls sideways; header cells stay visible (sticky). */
.tbl-wrap { overflow-x: auto; max-height: 420px; overflow-y: auto; border: 1px solid var(--line); border-radius: 4px; }
table { border-collapse: collapse; width: 100%; font-size: 0.8rem; }
th, td { padding: 4px 8px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; font-variant-numeric: tabular-nums; }
th { position: sticky; top: 0; background: var(--panel-2); font-weight: 600; color: var(--muted); font-size: 0.74rem; }
td:first-child, th:first-child { text-align: left; }
td.mono { font-family: var(--font-mono); }
.note { font-size: 0.8rem; color: var(--muted); max-width: 80ch; }
.note code, .mono { font-family: var(--font-mono); font-size: 0.78rem; }
.warn { color: var(--warn); font-size: 0.8rem; }

/* Phase tab: clock plot and phase-versus-row plot side by side (stacked on narrow screens). */
.phase-charts { display: grid; grid-template-columns: minmax(260px, 360px) minmax(0, 1fr); gap: 12px; align-items: start; margin-bottom: 12px; }
@media (max-width: 760px) { .phase-charts { grid-template-columns: minmax(0, 1fr); } }
/* Periodogram tab: one small periodogram per regression fit. */
.pg-multi { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; margin-bottom: 8px; }
.pg-cell { min-width: 0; }
.pg-title { font-size: 0.8rem; font-weight: 600; margin-bottom: 4px; }
h3.sub { font-family: var(--font-display); font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 14px 0 6px; }

/* --------------------------------------------------------------------------
   8. Lighting schedule editor and regression-fit list (control rail)
   -------------------------------------------------------------------------- */
/* One .seg per schedule segment: "from day", condition, and for LD a
   sub-row with lights-on time, L and D durations and a remove button. */
.sched { display: flex; flex-direction: column; gap: 6px; }
.seg { display: grid; grid-template-columns: 44px 58px 1fr; gap: 4px; align-items: center; padding: 6px; border: 1px solid var(--line); border-radius: 4px; }
.seg .sub { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 4px; align-items: center; }
.seg .sub label { font-size: 0.7rem; color: var(--muted); display: block; }
/* One .fitrow per regression fit: colour swatch, name, summary, remove. */
.fits { display: flex; flex-direction: column; gap: 4px; }
.fitrow { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; gap: 6px; align-items: center; padding: 4px 6px; border: 1px solid transparent; border-radius: 4px; cursor: pointer; font-size: 0.82rem; }
.fitrow:hover { background: var(--panel-2); }
.fitrow.sel { border-color: var(--accent); background: var(--panel-2); }  /* the active fit */
.fitrow .fn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fitrow .x { border: none; background: none; padding: 0 4px; color: var(--muted); }
.fitrow .sw { margin: 0; }

/* --------------------------------------------------------------------------
   9. Miscellaneous: footer, empty states, toast
   -------------------------------------------------------------------------- */
.foot { margin-top: 24px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 0.76rem; color: var(--muted); }
.empty { padding: 40px 16px; text-align: center; color: var(--muted); }
details.help summary { cursor: pointer; font-size: 0.82rem; color: var(--muted); }
details.help div { font-size: 0.8rem; color: var(--muted); margin-top: 6px; }
/* Toast: short status message in the bottom-right corner (see toast() in app.js). */
.toast { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 8px 12px; border-radius: 4px; font-size: 0.82rem; z-index: 20; }
@media (prefers-reduced-motion: no-preference) { .toast { transition: opacity 0.2s; } }
</style>
